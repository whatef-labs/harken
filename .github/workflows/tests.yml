name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: PHP ${{ matrix.php }} / Laravel ${{ matrix.laravel }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']
        laravel: ['12', '13']
        include:
          - laravel: '12'
            testbench: '^10.12'
          - laravel: '13'
            testbench: '^11.3'

    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pcntl, pgsql, sockets
          coverage: none

      - name: Install dependencies
        run: |
          composer require "orchestra/testbench:${{ matrix.testbench }}" --dev --no-update --no-interaction
          composer update --prefer-dist --no-interaction --no-progress

      - name: Code style
        run: vendor/bin/pint --test

      - name: Static analysis
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=1G

      - name: Tests
        run: vendor/bin/pest --exclude-group=integration

  integration:
    name: Integration (EMQX)
    runs-on: ubuntu-latest
    services:
      emqx:
        image: emqx/emqx:5.8.9
        ports:
          - 1883:1883
        options: >-
          --health-cmd "/opt/emqx/bin/emqx ctl status"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: pcntl, pgsql, sockets
          coverage: none

      - run: composer update --prefer-dist --no-interaction --no-progress

      - name: Integration tests
        run: vendor/bin/pest --group=integration
        env:
          HARKEN_TEST_BROKER_HOST: 127.0.0.1
