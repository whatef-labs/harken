global:
  scrape_interval: 5s

scrape_configs:
  # Each harken:start process serves /metrics (HARKEN_METRICS_DRIVER=prometheus).
  - job_name: harken
    static_configs:
      - targets: ["127.0.0.1:9180", "127.0.0.1:9181"]

  # EMQX 5 serves its metrics on the dashboard port.
  - job_name: emqx
    metrics_path: /api/v5/prometheus/stats
    static_configs:
      - targets: ["127.0.0.1:18083"]
